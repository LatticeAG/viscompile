[package]
name = "viscompile"
version = "0.1.0"
edition = "2021"
authors = ["LatticeAG"]
description = "VisCompile by LatticeAG - behavioral diff for AI agents"
repository = "https://github.com/LatticeAG/viscompile"
homepage = "https://github.com/LatticeAG/viscompile"
readme = "README.md"
license = "MIT"
rust-version = "1.86"
keywords = ["agents", "diff", "cli", "canonicalization"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "schemas/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "AGENT.md",
]

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
# default features stay off because they enable reqwest
jsonschema = { version = "0.48.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
termcolor = "1.4"
thiserror = "2.0"
